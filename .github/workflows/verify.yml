name: Verify V1.0 dynamic-comic pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run behavioral checks
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run deterministic camera checks
        run: node --test scripts/test_camera_runtime.mjs scripts/test_character_runtime.mjs scripts/test_performance_runtime.mjs
      - name: Compile example prompts
        run: python scripts/pipeline.py compile examples/library
      - name: Validate example contracts
        run: python scripts/pipeline.py validate examples/library
  render-fixture:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: assets/remotion/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build local test assets
        run: python scripts/make_dialogue_fixture.py acting-fixture
      - name: Prepare renderer
        run: python scripts/pipeline.py prepare acting-fixture --renderer manga-renderer
      - name: Install renderer dependencies
        working-directory: manga-renderer
        run: npm ci
      - name: Render fixture MP4
        working-directory: manga-renderer
        run: npm run render
      - name: Build camera/parallax test scene
        run: python scripts/make_camera_parallax_fixture.py camera-fixture
      - name: Validate and prepare camera/parallax renderer
        run: |
          python scripts/pipeline.py validate camera-fixture --assets
          python scripts/pipeline.py prepare camera-fixture --renderer camera-renderer
      - name: Install camera renderer dependencies
        working-directory: camera-renderer
        run: npm ci
      - name: Render camera/parallax MP4
        working-directory: camera-renderer
        run: npm run render
      - name: Build Character Performance and camera regression scene
        run: python scripts/make_character_performance_fixture.py character-performance-fixture
      - name: Validate and prepare Character Performance renderer
        run: |
          python scripts/pipeline.py validate character-performance-fixture --assets
          python scripts/pipeline.py prepare character-performance-fixture --renderer character-performance-renderer
      - name: Install Character Performance renderer dependencies
        working-directory: character-performance-renderer
        run: npm ci
      - name: Render Character Performance MP4
        working-directory: character-performance-renderer
        run: npm run render
      - name: Build comedy and knowledge director fixtures
        run: |
          python scripts/make_director_fixtures.py comedy phase3-comedy-fixture
          python scripts/make_director_fixtures.py knowledge phase3-knowledge-fixture
      - name: Prepare and install director renderer
        run: |
          python scripts/pipeline.py prepare phase3-comedy-fixture --renderer phase3-director-renderer
          cd phase3-director-renderer && npm ci
      - name: Render comedy director MP4
        working-directory: phase3-director-renderer
        run: npx remotion render src/index.tsx MangaMotion out/phase3-dialogue-comedy.mp4 --codec=h264
      - name: Prepare knowledge director timeline
        run: python scripts/pipeline.py prepare phase3-knowledge-fixture --renderer phase3-director-renderer
      - name: Render knowledge director MP4
        working-directory: phase3-director-renderer
        run: npx remotion render src/index.tsx MangaMotion out/phase3-knowledge-dialogue.mp4 --codec=h264
      - name: Build comic performance fixture (prop motion, sound, effects, audio bed)
        run: |
          python scripts/make_performance_fixture.py performance-fixture
          python scripts/pipeline.py validate performance-fixture --assets
          python scripts/pipeline.py prepare performance-fixture --renderer performance-renderer
      - name: Install comic performance renderer dependencies
        working-directory: performance-renderer
        run: npm ci
      - name: Render comic performance MP4
        working-directory: performance-renderer
        run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: manga-motion-video-fixture
          path: manga-renderer/out/video.mp4
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: camera-parallax-video-fixture
          path: camera-renderer/out/video.mp4
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: character-performance-video-fixture
          path: character-performance-renderer/out/video.mp4
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-dialogue-comedy
          path: phase3-director-renderer/out/phase3-dialogue-comedy.mp4
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: comic-performance-video-fixture
          path: performance-renderer/out/video.mp4
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-knowledge-dialogue
          path: phase3-director-renderer/out/phase3-knowledge-dialogue.mp4
          if-no-files-found: error
